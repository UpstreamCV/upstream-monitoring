# Alertmanager — single email receiver (solo operator, no pager), per
# upstream-streaming-server/docs/design/01-observability.md §6.
#
# Sends via Resend's SMTP interface — the same service (and same
# verified sender, hello@upstreamcv.com) the upstream-web waitlist uses,
# so the domain's DKIM/SPF are already in place. Username is literally
# "resend"; the password is a Resend API key, supplied via the secrets
# file below (create a dedicated key named "alertmanager" in the Resend
# dashboard — do not reuse the web app's key). Mail cannot send until
# that file holds a real key.

global:
  smtp_smarthost: "smtp.resend.com:587"
  smtp_from: "hello@upstreamcv.com"
  smtp_auth_username: "resend"
  # Password comes from a file so it is never committed (same pattern as
  # prometheus/secrets/). Create alertmanager/secrets/smtp_password on
  # the box from the .example.
  smtp_auth_password_file: /etc/alertmanager/secrets/smtp_password
  smtp_require_tls: true

route:
  receiver: operator-email
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  # Solo operator: re-send unresolved alerts every 4h, not every few minutes.
  repeat_interval: 4h

receivers:
  - name: operator-email
    email_configs:
      - to: "elkan@upstreamcv.com"
        send_resolved: true
