# Alertmanager — single email receiver (solo operator, no pager), per
# upstream-streaming-server/docs/design/01-observability.md §6.
#
# Recipient is real (elkan@upstreamcv.com); the SMTP SENDING values
# below are still placeholders — the `.invalid` TLD is RFC 2606-reserved
# and can never resolve, so this config cannot accidentally send mail
# until you fill in a real relay per README.md ("Alertmanager: filling
# in SMTP").

global:
  smtp_smarthost: "smtp.example.invalid:587"
  smtp_from: "hello@upstreamcv.com"
  smtp_auth_username: "REPLACE_ME_SMTP_USERNAME"
  # Password comes from a file so it is never committed (same pattern as
  # prometheus/secrets/). Create alertmanager/secrets/smtp_password on
  # the box from the .example.
  smtp_auth_password_file: /etc/alertmanager/secrets/smtp_password
  smtp_require_tls: true

route:
  receiver: operator-email
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  # Solo operator: re-send unresolved alerts every 4h, not every few minutes.
  repeat_interval: 4h

receivers:
  - name: operator-email
    email_configs:
      - to: "elkan@upstreamcv.com"
        send_resolved: true
